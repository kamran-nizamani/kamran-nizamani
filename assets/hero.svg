<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Kamran Khan, Full-Stack Developer, AI/ML, Cloud Learner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#0B1F26"/>
      <stop offset="1" stop-color="#0F3D3A"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#14B8A6" fill-opacity="0.18"/>
    </pattern>
    <clipPath id="typeclip">
      <rect x="64" y="214" width="0" height="34">
        <animate attributeName="width" values="0;470;470;0" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'SF Mono',Menlo,monospace; }
    .sans { font-family: 'Inter','Segoe UI',Helvetica,Arial,sans-serif; }
    .fadeup { opacity: 0; animation: fadeup 0.9s ease-out forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.35s; } .d3 { animation-delay: 0.6s; } .d4 { animation-delay: 0.85s; }
    @keyframes fadeup { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .blink { animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  </style>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <circle cx="960" cy="160" r="230" fill="url(#glow)"/>

  <!-- left text -->
  <text class="mono fadeup d1" x="64" y="70" font-size="15" fill="#14B8A6">~/kamran-nizamani <tspan fill="#6B7280">on</tspan> <tspan fill="#5EEAD4">main</tspan></text>
  <text class="sans fadeup d2" x="62" y="150" font-size="66" font-weight="800" fill="url(#name)" letter-spacing="-1.5">Kamran Khan</text>
  <text class="sans fadeup d3" x="64" y="188" font-size="21" font-weight="500" fill="#A7B4C2">Full-Stack Developer  ·  AI/ML  ·  Cloud Learner</text>

  <!-- typed line -->
  <g class="fadeup d4">
    <text class="mono" x="64" y="236" font-size="19" fill="#14B8A6">❯</text>
    <g clip-path="url(#typeclip)">
      <text class="mono" x="90" y="236" font-size="19" fill="#E6EDF3">building things end to end_</text>
    </g>
  </g>

  <!-- right: orbit graphic -->
  <g transform="translate(960 160)"><g class="float">
    <circle r="62" fill="none" stroke="#14B8A6" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle r="104" fill="none" stroke="#14B8A6" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="4 8"/>
    <circle r="146" fill="none" stroke="#14B8A6" stroke-opacity="0.14" stroke-width="1.5"/>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      <circle cx="62" cy="0" r="7" fill="#14B8A6"/>
      <circle cx="-62" cy="0" r="4" fill="#5EEAD4"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite"/>
      <circle cx="104" cy="0" r="8" fill="#38BDF8"/>
      <circle cx="-74" cy="-74" r="5" fill="#A78BFA"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="34s" repeatCount="indefinite"/>
      <circle cx="146" cy="0" r="9" fill="#F59E0B"/>
      <circle cx="-103" cy="103" r="5" fill="#14B8A6"/>
    </g>

    <circle r="38" fill="#0D1117" stroke="#14B8A6" stroke-width="2"/>
    <text class="mono" y="9" font-size="26" font-weight="700" fill="#5EEAD4" text-anchor="middle">&lt;/&gt;</text>
  </g></g>

  <!-- bottom accent line -->
  <rect x="0" y="316" width="1200" height="4" fill="#14B8A6" fill-opacity="0.7"/>
</svg>
